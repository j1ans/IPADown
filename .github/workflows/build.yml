name: Build desktop apps

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            os: windows-latest
            platform: win
            arch: x64
            target: nsis
          - name: linux-x64
            os: ubuntu-latest
            platform: linux
            arch: x64
            target: AppImage
          - name: macos-intel
            os: macos-15-intel
            platform: mac
            arch: x64
            target: dmg
          - name: macos-apple-silicon
            os: macos-15
            platform: mac
            arch: arm64
            target: dmg
    runs-on: ${{ matrix.os }}
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Package ${{ matrix.name }}
        run: npx electron-builder --${{ matrix.platform }} ${{ matrix.target }} --${{ matrix.arch }} --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: ipaDown-${{ matrix.name }}
          path: dist/
          if-no-files-found: error
          retention-days: 14
